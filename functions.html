<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thrive Admin - Functions</title>
    <link rel="icon" type="image/svg+xml" href="./assets/company_marketing_assets/app-icon.svg?v=20260314" />
    <link rel="alternate icon" href="./favicon.ico?v=20260314" sizes="any" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png?v=20260314" />
    <link rel="manifest" href="./site.webmanifest?v=20260314" />
    <meta name="theme-color" content="#31b7c8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Admin" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=20260601" />
  </head>
  <body class="auth-pending">
    <header class="topbar">
      <div class="container topbar-inner">
        <a class="brand" href="./index.html" aria-label="Thrive Admin home">
          <img class="brand-mark" src="./assets/company_marketing_assets/thrive-mascot-RGB.svg" alt="Thrive mascot logo" />
          <span class="brand-text">Thrive Admin</span>
        </a>
        <div class="topbar-actions">
          <nav id="primaryNav" class="topnav" aria-label="Primary"></nav>
          <button id="signOutBtn" class="secondary" type="button">Sign out</button>
        </div>
      </div>
    </header>

    <main class="container functions-main">
      <section class="hero compact">
        <h1>Functions</h1>
        <p id="statusMessage" class="muted">Checking access...</p>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>WhatsApp Text</h2>
            <p class="muted">Open a pre-filled WhatsApp message to a phone number.</p>
          </div>
        </div>

        <form id="recruitmentWhatsappForm" class="functions-form">
          <fieldset class="functions-segmented-field">
            <legend>Message</legend>
            <div class="functions-segmented-control">
              <label>
                <input type="radio" name="whatsappMessageType" value="recruitment" checked />
                <span>Recruitment</span>
              </label>
              <label>
                <input type="radio" name="whatsappMessageType" value="intro" />
                <span>Intro</span>
              </label>
            </div>
          </fieldset>

          <fieldset id="introServiceField" class="functions-segmented-field" hidden>
            <legend>Service</legend>
            <div class="functions-segmented-control functions-segmented-control-wide">
              <label>
                <input type="radio" name="introService" value="thrive" checked />
                <span>Thrive Homecare</span>
              </label>
              <label>
                <input type="radio" name="introService" value="mentalCapacity" />
                <span>Plan with Care / Mental Capacity</span>
              </label>
            </div>
          </fieldset>

          <div class="functions-form-grid">
            <label class="field" for="candidateNameInput">
              Name
              <input id="candidateNameInput" type="text" placeholder="Optional" autocomplete="name" />
            </label>
            <label class="field" for="phoneNumberInput">
              Phone number
              <input id="phoneNumberInput" type="tel" placeholder="07700 900000" autocomplete="tel" required />
            </label>
          </div>

          <div class="row wrap-row">
            <button id="openRecruitmentWhatsappBtn" type="submit">Open WhatsApp</button>
            <button id="copyRecruitmentMessageBtn" class="secondary" type="button">Copy Message</button>
            <span id="actionStatus" class="muted"></span>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>Quick Links</h2>
            <p class="muted">More shortcuts can live here as they are added.</p>
          </div>
        </div>
        <div class="functions-link-grid">
          <a class="home-menu-link" href="./email-templates.html">
            <span class="home-menu-link-title-row">
              <span class="home-menu-link-title">Email Templates</span>
            </span>
            <span class="home-menu-link-meta">Open the email drafting page.</span>
          </a>
        </div>
      </section>
    </main>

    <script type="module" src="./functions.js"></script>
  </body>
</html>
